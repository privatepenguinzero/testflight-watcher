services:
  testflight-watcher:
    build: .
    container_name: testflight-watcher
    restart: unless-stopped
    # Serve per poter scrivere su ./data.
    # Con podman rootless NON è root vero: l'UID 0 del container viene
    # mappato sull'utente dell'host (1000), quindi i file restano 1000:1000.
    # Se un giorno passi a Docker rootful, togli questa riga e usa
    # l'utente non-root definito nel Dockerfile, oppure i file scritti nel
    # volume finiranno di proprietà di root.
    user: "0:0"
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Apple dichiara Cache-Control: max-age=600 sulle pagine di join:
      # scendere sotto i 600s non anticipa la risposta, la rilegge dalla cache.
      - CHECK_INTERVAL=${CHECK_INTERVAL:-300}
      # Fingerprint TLS impersonato da curl_cffi
      - IMPERSONATE=${IMPERSONATE:-safari17_0}
    volumes:
      # Mappa solo la CARTELLA, non il file singolo!
      - ./data:/app/data
    # Senza questo il container resterebbe "Up" anche con la sorveglianza
    # ferma: il bot continuerebbe a rispondere ai comandi mostrando gli
    # ultimi stati salvati, sembrando perfettamente vivo.
    healthcheck:
      test: ["CMD", "python", "-m", "testflight_watcher.healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      # Il primo giro di controlli deve avere il tempo di completarsi.
      start_period: 90s
    networks:
      - frontend
networks:
  frontend:
    external: true